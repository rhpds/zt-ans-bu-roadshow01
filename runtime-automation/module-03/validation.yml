---
# validation.yml — Module 03: Generating a Windows Patch Report

# Get Windows Update Report template
- name: Get Windows Update Report template
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Windows+Update+Report"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_wur

# Check survey exists
- name: Get survey spec
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ r_wur.json.results[0].id }}/survey_spec/"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_survey
  when: r_wur.json.count > 0

# Check survey enabled
- name: Get template details
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ r_wur.json.results[0].id }}/"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_wur_detail
  when: r_wur.json.count > 0

# Check job ran successfully
- name: Get Windows Update Report jobs
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ r_wur.json.results[0].id }}/jobs/?order_by=-finished&page_size=10"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_wur_jobs
  when: r_wur.json.count > 0

# Evaluate results
- name: Set validation results
  ansible.builtin.set_fact:
    survey_ok: "{{ r_wur.json.count > 0 and (r_survey.json.spec | default([]) | selectattr('variable', 'equalto', 'update_category') | list | length > 0) }}"
    survey_enabled_ok: "{{ r_wur.json.count > 0 and (r_wur_detail.json.survey_enabled | default(false)) }}"
    job_ok: "{{ r_wur.json.count > 0 and (r_wur_jobs.json.results | default([]) | selectattr('status', 'equalto', 'successful') | list | length > 0) }}"

- name: Set validation output
  ansible.builtin.set_fact:
    validation_output: |
      Module 3 Validation
      ===================
      {{ '[OK]' if survey_ok | bool else '[X] ' }} Survey created on Windows Update Report
      {{ '[OK]' if survey_enabled_ok | bool else '[X] ' }} Survey enabled on Windows Update Report
      {{ '[OK]' if job_ok | bool else '[X] ' }} Windows Update Report job launched
    validation_passed: >-
      {{ survey_ok | bool and survey_enabled_ok | bool and job_ok | bool }}

- name: Write failure details
  ansible.builtin.copy:
    content: "{{ validation_output }}"
    dest: "{{ job_info_dir }}/validation_failure.out"
  delegate_to: localhost
  when:
    - job_info_dir is defined
    - not validation_passed | bool

- name: Fail if not passed
  ansible.builtin.fail:
    msg: "Complete the missing tasks and try again."
  when: not validation_passed | bool
