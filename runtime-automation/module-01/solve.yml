---
# solve.yml — Module 01: Introspection and System Backups

# Step 1: Get template IDs
- name: Get Check RHEL Backup template
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Check+RHEL+Backup"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_check_rhel

- name: Get Server Backup XFS/RHEL template
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Server+Backup+-+XFS%2FRHEL"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_xfs

- name: Get Server Backup VSS/Windows template
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Server+Backup+-+VSS%2FWindows"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_vss

- name: Get Check Windows Backups template
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/?name=Check+Windows+Backups"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_check_win

- name: Set template IDs
  ansible.builtin.set_fact:
    check_rhel_id: "{{ r_check_rhel.json.results[0].id }}"
    xfs_id: "{{ r_xfs.json.results[0].id }}"
    vss_id: "{{ r_vss.json.results[0].id }}"
    check_win_id: "{{ r_check_win.json.results[0].id }}"

# Step 2: Launch Check RHEL Backup
- name: Launch Check RHEL Backup
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ check_rhel_id }}/launch/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: {}
    status_code: [200, 201]
  register: r_launch_check_rhel

- name: Wait for Check RHEL Backup
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/jobs/{{ r_launch_check_rhel.json.id }}/"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_job
  until: r_job.json.status in ['successful', 'failed', 'error', 'canceled']
  retries: 60
  delay: 10

- name: Fail if Check RHEL Backup failed
  ansible.builtin.fail:
    msg: "Check RHEL Backup failed with status: {{ r_job.json.status }}"
  when: r_job.json.status != 'successful'

# Step 3: Launch Server Backup - XFS/RHEL (takes ~6-7 min)
- name: Launch Server Backup XFS/RHEL
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ xfs_id }}/launch/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: {}
    status_code: [200, 201]
  register: r_launch_xfs

- name: Wait for Server Backup XFS/RHEL
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/jobs/{{ r_launch_xfs.json.id }}/"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_job
  until: r_job.json.status in ['successful', 'failed', 'error', 'canceled']
  retries: 60
  delay: 15

- name: Fail if Server Backup XFS/RHEL failed
  ansible.builtin.fail:
    msg: "Server Backup XFS/RHEL failed with status: {{ r_job.json.status }}"
  when: r_job.json.status != 'successful'

# Step 3b: Re-run Check RHEL Backup after XFS/RHEL completes
- name: Launch Check RHEL Backup (post-XFS)
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ check_rhel_id }}/launch/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: {}
    status_code: [200, 201]
  register: r_launch_check_rhel2

- name: Wait for Check RHEL Backup (post-XFS)
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/jobs/{{ r_launch_check_rhel2.json.id }}/"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_job
  until: r_job.json.status in ['successful', 'failed', 'error', 'canceled']
  retries: 60
  delay: 10

- name: Fail if Check RHEL Backup (post-XFS) failed
  ansible.builtin.fail:
    msg: "Check RHEL Backup (post-XFS) failed with status: {{ r_job.json.status }}"
  when: r_job.json.status != 'successful'

# Step 4: Launch Server Backup - VSS/Windows
- name: Launch Server Backup VSS/Windows
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ vss_id }}/launch/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: {}
    status_code: [200, 201]
  register: r_launch_vss

- name: Wait for Server Backup VSS/Windows
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/jobs/{{ r_launch_vss.json.id }}/"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_job
  until: r_job.json.status in ['successful', 'failed', 'error', 'canceled']
  retries: 60
  delay: 10

- name: Fail if Server Backup VSS/Windows failed
  ansible.builtin.fail:
    msg: "Server Backup VSS/Windows failed with status: {{ r_job.json.status }}"
  when: r_job.json.status != 'successful'

# Step 5: Launch Check Windows Backups
- name: Launch Check Windows Backups
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ check_win_id }}/launch/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body: {}
    status_code: [200, 201]
  register: r_launch_check_win

- name: Wait for Check Windows Backups
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/jobs/{{ r_launch_check_win.json.id }}/"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_job
  until: r_job.json.status in ['successful', 'failed', 'error', 'canceled']
  retries: 60
  delay: 10

- name: Fail if Check Windows Backups failed
  ansible.builtin.fail:
    msg: "Check Windows Backups failed with status: {{ r_job.json.status }}"
  when: r_job.json.status != 'successful'

# Step 6: Create schedule "2 Min Snappy" on VSS/Windows template
- name: Check if schedule already exists
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/job_templates/{{ vss_id }}/schedules/"
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
  register: r_schedules

- name: Set schedule exists fact
  ansible.builtin.set_fact:
    schedule_exists: "{{ r_schedules.json.results | selectattr('name', 'equalto', '2 Min Snappy') | list | length > 0 }}"

- name: Get current UTC timestamp
  ansible.builtin.set_fact:
    schedule_dtstart: "{{ lookup('pipe', 'date -u +%Y%m%dT%H%M%SZ') }}"

- name: Create schedule 2 Min Snappy
  ansible.builtin.uri:
    url: "{{ aap_host }}/api/controller/v2/schedules/"
    method: POST
    user: "{{ aap_username }}"
    password: "{{ aap_password }}"
    force_basic_auth: true
    validate_certs: false
    body_format: json
    body:
      name: "2 Min Snappy"
      description: "Automated VSS Snaps"
      rrule: "DTSTART:{{ schedule_dtstart }} RRULE:FREQ=MINUTELY;INTERVAL=2"
      unified_job_template: "{{ vss_id | int }}"
    status_code: [200, 201]
  when: not schedule_exists | bool
